<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sculpt test loop</title>
<style>
  :root {
    --bg: #0a0b0f; --panel: #11131a; --fg: #e6e7ee; --muted: #8d90a0; --faint: #5a5d6c;
    --accent: #7c9bff; --border: #1d2030; --border-strong: #2a2e44; --warn: #ffb86b; --bad: #ff7b7b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
  #view { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: 14px; bottom: 12px; color: var(--muted); font-size: 12px;
    font-family: ui-monospace, monospace; pointer-events: none; }
  #hint { position: absolute; left: 14px; top: 12px; color: var(--muted); font-size: 12.5px;
    pointer-events: none; max-width: 520px; }
  #hint kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 0 4px; color: var(--fg); }
  aside { background: var(--panel); border-left: 1px solid var(--border); padding: 16px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
    margin: 0 0 8px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .val { font-family: ui-monospace, monospace; color: var(--fg); min-width: 52px; text-align: right; }
  select, button { background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 6px; align-items: center;
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
  li .desc { font-family: ui-monospace, monospace; color: var(--fg); overflow-wrap: anywhere; }
  li.off .desc { color: var(--faint); text-decoration: line-through; }
  li.bad { border-color: var(--bad); }
  li.blocked .desc { color: var(--faint); }
  li .err { grid-column: 2 / 4; color: var(--bad); font-size: 11.5px; }
  li button { padding: 1px 7px; font-size: 12px; }
  .empty { color: var(--faint); font-size: 12.5px; }
  li.editing { border-color: var(--accent); }
  .edit { grid-column: 1 / 4; display: grid; grid-template-columns: 52px repeat(3, minmax(0, 1fr)); gap: 6px 6px;
    align-items: center; padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--border); }
  .edit .lbl { color: var(--muted); font-size: 12px; }
  .edit input[type=number] { width: 100%; min-width: 0; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 5px; padding: 3px 5px;
    font: 12px ui-monospace, monospace; }
  .edit input[type=number]:focus { outline: none; border-color: var(--accent); }
  .edit input[type=range] { grid-column: 2 / 5; }
  .edit .wide { grid-column: 2 / 5; display: flex; gap: 6px; align-items: center; }
  .edit .wide input[type=range] { flex: 1; }
  .edit .wide .val { min-width: 60px; font-size: 12px; }
  .edit .actions { grid-column: 1 / 5; display: flex; gap: 8px; justify-content: flex-end; }
  .edit .actions .primary { background: var(--accent); border-color: var(--accent); color: #0a0b0f; font-weight: 600; }
  .edit .msg { grid-column: 1 / 5; color: var(--bad); font-size: 11.5px; min-height: 0; }
  .edit .tip { grid-column: 1 / 5; color: var(--faint); font-size: 11px; }
  #file { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  #loadErr { color: var(--warn); font-size: 12px; white-space: pre-wrap; }
  @media (max-width: 760px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
    aside { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view">
  <div id="hint">Drag on the surface to pull it out, drag down to push it in.
    <kbd>Shift</kbd>-drag pulls sideways in the screen plane.
    Drag off the form to orbit, scroll to zoom. <kbd>Ctrl/⌘ Z</kbd> undoes the last step.</div>
  <div id="hud"></div>
</div>
<aside>
  <section>
    <h2>Brush</h2>
    <label>radius <input id="radius" type="range" min="2" max="16" step="0.5" value="7"><span class="val" id="radiusVal"></span></label>
    <label style="margin-top:6px"><input id="mirror" type="checkbox"> mirror across X: each pull also lands on the opposite side</label>
  </section>
  <section>
    <h2>Start over</h2>
    <div class="row">
      <select id="start"><option>figure</option><option>sphere</option><option>box</option></select>
      <button id="restart" title="Replace the whole history with this form">Start over</button>
    </div>
  </section>
  <section>
    <h2>History</h2>
    <ol id="steps"></ol>
  </section>
  <section>
    <h2>File</h2>
    <div id="file"></div>
    <div id="loadErr"></div>
  </section>
</aside>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js'

// Fold limit of sculpt.Pull is 0.65 × radius; stay just under it.
const MAX_PULL = 0.6

const view = document.getElementById('view')
const hud = document.getElementById('hud')
const radiusInput = document.getElementById('radius')
const radiusVal = document.getElementById('radiusVal')
const mirrorInput = document.getElementById('mirror')

// ── Scene ────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
view.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x0a0b0f)
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000)
camera.up.set(0, 0, 1)
camera.position.set(-45, -80, 40)
const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 0, 6)
controls.enableDamping = true
controls.update()

scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x20222c, 1.1))
const key = new THREE.DirectionalLight(0xffffff, 1.6)
key.position.set(-40, -60, 80)
scene.add(key)
const rim = new THREE.DirectionalLight(0x7c9bff, 0.6)
rim.position.set(50, 60, 20)
scene.add(rim)
const grid = new THREE.GridHelper(80, 16, 0x2a2e44, 0x1d2030)
grid.rotation.x = Math.PI / 2
grid.position.z = -12
scene.add(grid)

const material = new THREE.MeshStandardMaterial({ color: 0xb8c4e8, roughness: 0.55, metalness: 0.05 })
const form = new THREE.Mesh(new THREE.BufferGeometry(), material)
scene.add(form)

// The brush: a ring on the surface showing the radius, and the pull arrow.
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.96, 1, 64),
  new THREE.MeshBasicMaterial({ color: 0x7c9bff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, depthTest: false })
)
ring.renderOrder = 2
ring.visible = false
scene.add(ring)
// Where the mirror copy of a pull will land, shown only while mirror is on.
const mirrorRing = new THREE.Mesh(ring.geometry,
  new THREE.MeshBasicMaterial({ color: 0x7c9bff, side: THREE.DoubleSide, transparent: true, opacity: 0.45, depthTest: false }))
mirrorRing.renderOrder = 2
mirrorRing.visible = false
scene.add(mirrorRing)
const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 1, 0xffb86b, 1, 0.6)
arrow.visible = false
arrow.line.material.depthTest = false
arrow.cone.material.depthTest = false
arrow.renderOrder = 3
scene.add(arrow)
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffb86b, depthTest: false }))
marker.renderOrder = 3
marker.visible = false
scene.add(marker)

function resize() {
  const w = view.clientWidth, h = view.clientHeight
  renderer.setSize(w, h, false)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}
new ResizeObserver(resize).observe(view)
resize()

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera) })

// ── Server ───────────────────────────────────────────────────────────
let state = { version: -1, history: { steps: [] } }
let lastInfo = {}

function setMesh(buf) {
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf), 3))
  const merged = mergeVertices(g, 1e-4)
  merged.computeVertexNormals()
  form.geometry.dispose()
  form.geometry = merged
  form.geometry.computeBoundsTree?.()
}

async function fetchMesh(res, info) {
  const buf = await res.arrayBuffer()
  info = JSON.parse(res.headers.get('X-Mesh-Info') || '{}')
  if (buf.byteLength) setMesh(buf)
  lastInfo = info
  showHud()
  return info
}

function showHud(extra = '') {
  const i = lastInfo
  hud.textContent = `${i.triangles ?? 0} triangles · ${i.millis ?? 0} ms` + (extra ? ` · ${extra}` : '') +
    (i.error ? ` · ${i.error}` : '')
}

async function loadState() {
  const s = await (await fetch('/api/state')).json()
  const changed = s.version !== state.version
  state = s
  renderPanel()
  if (changed) await fetchMesh(await fetch('/api/mesh'))
  renderPanel()
}

async function post(url, body, method = 'POST') {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) })
  if (!res.ok) { hud.textContent = await res.text(); return }
  state = await res.json()
  renderPanel()
  await fetchMesh(await fetch('/api/mesh'))
  renderPanel()
}

// A hand edit, or anything else writing the file, shows up here.
// If the server is down (restarted, say), say so and pick up again when it
// is back.
let offline = false
setInterval(async () => {
  if (dragging || editing) return
  try {
    const s = await (await fetch('/api/state')).json()
    if (offline) { offline = false; showHud() }
    if (s.version !== state.version) loadState()
  } catch {
    offline = true
    hud.textContent = 'server not reachable; start it with make sculpt'
  }
}, 1000)

// ── Panel ────────────────────────────────────────────────────────────
const fmt = v => Array.isArray(v) ? v.map(x => (Math.round(x * 10) / 10).toString()).join(', ') : JSON.stringify(v)
const isPull = st => st.op === 'sculpt.Pull' && st.args && Array.isArray(st.args.at) && Array.isArray(st.args.by)

// A step in one line: a pull by its numbers, anything else by its op and
// args as written.
function describe(st) {
  if (st.anchor) return `${st.name || 'anchor'}: anchor ${JSON.stringify(st.anchor)}`
  const name = st.name ? st.name + ': ' : ''
  if (isPull(st)) {
    const a = st.args
    return `${name}pull at (${fmt(a.at)}) by (${fmt(a.by)}) r ${a.radius}` + (st.mirror ? `, mirrored in ${st.mirror}` : '')
  }
  let args = st.args === undefined ? '' : ' ' + brief(st.args)
  if (st.then) args += ' then ' + st.then.map(c => c.op + (c.args === undefined ? '' : ' ' + brief(c.args))).join(', ')
  return `${name}${st.op}${args}`
}

// brief writes args as they read in the file: {radius: 12}, [0, 0, 14], an
// inline op as op(args).
function brief(v) {
  if (Array.isArray(v)) return '[' + v.map(brief).join(', ') + ']'
  if (v && typeof v === 'object') {
    if (typeof v.op === 'string') return v.op.replace(/^solid\./, '') + '(' + (v.args === undefined ? '' : brief(v.args).replace(/^[[{]|[\]}]$/g, '')) + ')'
    return '{' + Object.entries(v).map(([k, x]) => `${k}: ${brief(x)}`).join(', ') + '}'
  }
  return typeof v === 'number' ? (Math.round(v * 100) / 100).toString() : String(v)
}

// The status of each step that is not ok, from the last mesh.
const statusOf = i => (lastInfo.steps || []).find(s => s.index === i)

function renderPanel() {
  document.getElementById('file').textContent = state.file || ''
  document.getElementById('loadErr').textContent = state.loadErr ? 'The file does not parse; showing the last good version.\n' + state.loadErr : ''
  const ol = document.getElementById('steps')
  ol.replaceChildren()
  const steps = state.history.steps || []
  if (!steps.length) {
    const p = document.createElement('div')
    p.className = 'empty'
    p.textContent = 'No steps. Start over from a form.'
    ol.append(p)
    return
  }
  steps.forEach((st, i) => {
    const li = document.createElement('li')
    const status = statusOf(i)
    if (st.off) li.classList.add('off')
    if (status?.status === 'error') li.classList.add('bad')
    if (status?.status === 'blocked') li.classList.add('blocked')
    const on = document.createElement('input')
    on.type = 'checkbox'
    on.checked = !st.off
    on.title = 'Turn this step off without deleting it'
    on.onchange = () => post(`/api/steps/${i}/toggle`)
    const desc = document.createElement('span')
    desc.className = 'desc'
    desc.textContent = `${i + 1}. ${describe(st)}` + (st.by === 'agent' ? ' (agent)' : '')
    if (st.from) desc.title = 'from ' + st.from
    const del = document.createElement('button')
    del.textContent = '×'
    del.title = 'Delete this step'
    del.onclick = () => post(`/api/steps/${i}`, null, 'DELETE')
    const edit = document.createElement('button')
    edit.textContent = 'edit'
    edit.title = 'Change this step\'s numbers and watch the form update'
    edit.onclick = () => openEdit(i)
    const btns = document.createElement('span')
    btns.style.display = 'flex'
    btns.style.gap = '4px'
    if (isPull(st)) btns.append(edit)
    btns.append(del)
    li.append(on, desc, btns)
    if (editing?.index === i) {
      li.classList.add('editing')
      li.append(editForm(i))
    }
    if (status && !(editing?.index === i)) {
      const e = document.createElement('div')
      e.className = 'err'
      if (status.status === 'blocked') e.style.color = 'var(--muted)'
      e.textContent = status.error.replace(/\.?$/, '.')
      li.append(e)
    }
    if (isPull(st)) {
      li.onmouseenter = () => { if (!editing) { marker.position.set(...st.args.at); marker.visible = true } }
      li.onmouseleave = () => { if (!editing) marker.visible = false }
    }
    ol.append(li)
  })
}

// ── Step editor ──────────────────────────────────────────────────────
// One step at a time opens a form under its row. Every change previews the
// whole history with that step replaced, unsaved, and shows where the pull
// grabs and where it goes. Save writes it to the file; Cancel puts the
// form back as it was.
let editing = null // { index, step, original }

function openEdit(i) {
  const st = state.history.steps[i]
  editing = { index: i, step: structuredClone(st), original: st }
  renderPanel()
  showEditGizmo()
  previewEdit()
}

function closeEdit() {
  editing = null
  marker.visible = false
  arrow.visible = false
}

async function saveEdit() {
  // A step that fails cannot be saved from the form; the message says why.
  if (!editing || document.querySelector('.edit .primary')?.disabled) return
  const { index, step } = editing
  closeEdit()
  await post(`/api/steps/${index}`, step, 'PUT')
}

async function cancelEdit() {
  closeEdit()
  renderPanel()
  await fetchMesh(await fetch('/api/mesh'))
}

function previewEdit() {
  const steps = state.history.steps.slice()
  steps[editing.index] = editing.step
  preview(steps)
}

function showEditGizmo() {
  const st = editing.step.args
  marker.position.set(...st.at)
  marker.visible = true
  const by = new THREE.Vector3(...st.by)
  const len = by.length()
  arrow.visible = len > 0.05
  if (arrow.visible) {
    arrow.position.set(...st.at)
    arrow.setDirection(by.clone().normalize())
    arrow.setLength(len, Math.min(1.2, len * 0.4), Math.min(0.8, len * 0.3))
  }
}

// A number field that previews on every change.
function numberField(get, set, step) {
  const input = document.createElement('input')
  input.type = 'number'
  input.step = step
  const sync = () => { input.value = (Math.round(get() * 100) / 100).toString() }
  sync()
  input.oninput = () => { if (input.value !== '' && !isNaN(+input.value)) { set(+input.value); changed() } }
  input.onkeydown = e => {
    if (e.key === 'Enter') saveEdit()
    if (e.key === 'Escape') cancelEdit()
    // Shift with an arrow nudges by a whole millimetre; the browser's own
    // arrow handling does the 0.1 steps.
    if (e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault()
      input.value = (+input.value + (e.key === 'ArrowUp' ? 1 : -1)).toFixed(2)
      input.oninput()
    }
  }
  input.sync = sync
  return input
}

function label(text) {
  const lbl = document.createElement('span')
  lbl.className = 'lbl'
  lbl.textContent = text
  return lbl
}

let refreshEditFields = () => {}

function changed() {
  refreshEditFields()
  showEditGizmo()
  previewEdit()
}

function editForm(i) {
  const st = editing.step.args
  const box = document.createElement('div')
  box.className = 'edit'
  const fields = []
  const vecRow = (name, key) => {
    const row = [0, 1, 2].map(c => {
      const input = numberField(() => st[key][c], v => { st[key][c] = v }, 0.1)
      const f = { input }
      fields.push(f)
      return f
    })
    box.append(label(name), ...row.map(f => f.input))
  }
  vecRow('at', 'at')
  vecRow('by', 'by')

  // Radius: a slider and a number.
  const radiusRow = document.createElement('div')
  radiusRow.className = 'wide'
  const rSlider = document.createElement('input')
  rSlider.type = 'range'; rSlider.min = 1; rSlider.max = 20; rSlider.step = 0.1
  const rVal = document.createElement('span'); rVal.className = 'val'
  rSlider.oninput = () => { st.radius = +rSlider.value; changed() }
  radiusRow.append(rSlider, rVal)
  box.append(label('radius'), radiusRow)

  // Pull length: scales `by` keeping its direction, up to the fold limit.
  const lenRow = document.createElement('div')
  lenRow.className = 'wide'
  const lSlider = document.createElement('input')
  lSlider.type = 'range'; lSlider.min = 0; lSlider.step = 0.05
  const lVal = document.createElement('span'); lVal.className = 'val'
  lSlider.oninput = () => {
    const v = new THREE.Vector3(...st.by)
    if (v.length() < 1e-6) v.set(0, 0, 1)
    v.setLength(+lSlider.value)
    st.by = v.toArray()
    changed()
  }
  lenRow.append(lSlider, lVal)
  box.append(label('length'), lenRow)

  // Mirror: the same pull again across the X = 0 plane, in this one step.
  const mirrorRow = document.createElement('label')
  mirrorRow.className = 'wide'
  const mirrorBox = document.createElement('input')
  mirrorBox.type = 'checkbox'
  mirrorBox.checked = editing.step.mirror === 'x'
  mirrorBox.onchange = () => {
    if (mirrorBox.checked) editing.step.mirror = 'x'
    else delete editing.step.mirror
    changed()
  }
  mirrorRow.append(mirrorBox, 'also on the opposite side (x)')
  box.append(label('mirror'), mirrorRow)

  const msg = document.createElement('div')
  msg.className = 'msg'
  box.append(msg)

  const tip = document.createElement('div')
  tip.className = 'tip'
  tip.textContent = 'x, y, z in mm. Arrow keys nudge a number by 0.1, Shift+arrow by 1. Enter saves, Escape cancels.'
  box.append(tip)

  const actions = document.createElement('div')
  actions.className = 'actions'
  const cancel = document.createElement('button')
  cancel.textContent = 'Cancel'
  cancel.onclick = cancelEdit
  const save = document.createElement('button')
  save.textContent = 'Save'
  save.className = 'primary'
  save.onclick = saveEdit
  actions.append(cancel, save)
  box.append(actions)

  refreshEditFields = () => {
    fields.forEach(f => { if (document.activeElement !== f.input) f.input.sync() })
    rSlider.value = st.radius
    rVal.textContent = st.radius.toFixed(1) + ' mm'
    const len = Math.hypot(...st.by)
    lSlider.max = (0.64 * st.radius).toFixed(2) // just under the fold limit
    lSlider.value = len
    lVal.textContent = `${len.toFixed(2)} of ${(0.65 * st.radius).toFixed(1)}`
    const err = editing && statusOf(editing.index)
    const broken = err?.status === 'error'
    msg.textContent = broken ? err.error.replace(/\.?$/, '.') + ' Fix it to save.' : ''
    save.disabled = broken
  }
  refreshEditFields()
  return box
}

document.getElementById('restart').onclick = () => post('/api/start', { form: document.getElementById('start').value })
radiusInput.oninput = () => { radiusVal.textContent = radiusInput.value + ' mm'; ring.scale.setScalar(+radiusInput.value); mirrorRing.scale.setScalar(+radiusInput.value) }
radiusInput.oninput()
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !editing) { e.preventDefault(); post('/api/undo') }
  if (e.key === 'Escape' && editing) cancelEdit()
})

// ── Picking and the pull gesture ─────────────────────────────────────
const raycaster = new THREE.Raycaster()
const ndc = new THREE.Vector2()

function hitAt(ev) {
  const r = renderer.domElement.getBoundingClientRect()
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1)
  raycaster.setFromCamera(ndc, camera)
  const hit = raycaster.intersectObject(form)[0]
  if (!hit) return null
  const n = hit.face.normal.clone().transformDirection(form.matrixWorld).normalize()
  return { point: hit.point.clone(), normal: n }
}

function placeRing(p, n) {
  ring.position.copy(p).addScaledVector(n, 0.05)
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n)
  ring.visible = true
  mirrorRing.visible = mirrors(p.x)
  if (mirrorRing.visible) {
    const mp = new THREE.Vector3(-p.x, p.y, p.z), mn = new THREE.Vector3(-n.x, n.y, n.z)
    mirrorRing.position.copy(mp).addScaledVector(mn, 0.05)
    mirrorRing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), mn)
  }
}

// A pull gets a mirror copy only when mirror is on and the pull is off the
// mirror plane; on the plane the copy would land on top of it.
const mirrors = x => mirrorInput.checked && Math.abs(x) > +radiusInput.value * 0.25

let dragging = null
let inFlight = false, queued = null

// The step a drag makes: one pull, mirrored in x when mirror is on and the
// pull is off the mirror plane.
const round = v => v.map(x => Math.round(x * 1000) / 1000)
function pullSteps(d) {
  const step = { op: 'sculpt.Pull', args: { at: round(d.point.toArray()), by: round(d.by.toArray()), radius: +radiusInput.value } }
  if (mirrors(d.point.x)) step.mirror = 'x'
  return [step]
}

// preview shows an unsaved version of the whole step list. One request at
// a time; while one is out, only the newest waiting list is kept.
async function preview(steps) {
  if (inFlight) { queued = steps; return }
  inFlight = true
  try {
    const res = await fetch('/api/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ steps }) })
    if (dragging || editing) {
      await fetchMesh(res)
      if (editing) refreshEditFields()
    }
  } finally {
    inFlight = false
    if (queued && (dragging || editing)) { const q = queued; queued = null; preview(q) }
  }
}

const el = renderer.domElement
el.addEventListener('pointermove', ev => {
  if (dragging) return
  const h = hitAt(ev)
  if (h) placeRing(h.point, h.normal)
  else ring.visible = mirrorRing.visible = false
})

el.addEventListener('pointerdown', ev => {
  if (ev.button !== 0 || editing) return
  const h = hitAt(ev)
  if (!h) return // empty space: let the orbit controls have it
  controls.enabled = false
  el.setPointerCapture(ev.pointerId)
  // World size of one screen pixel at the grabbed point, for the drag scale.
  const dist = camera.position.distanceTo(h.point)
  const pxWorld = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / el.clientHeight
  const viewDir = new THREE.Vector3()
  camera.getWorldDirection(viewDir)
  dragging = {
    point: h.point, normal: h.normal, startY: ev.clientY, pxWorld,
    plane: new THREE.Plane().setFromNormalAndCoplanarPoint(viewDir, h.point),
    by: new THREE.Vector3()
  }
  placeRing(h.point, h.normal)
})

el.addEventListener('pointermove', ev => {
  const d = dragging
  if (!d) return
  const radius = +radiusInput.value
  if (ev.shiftKey) {
    // Sideways: wherever the cursor is, on the plane facing the camera.
    const r = el.getBoundingClientRect()
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1)
    raycaster.setFromCamera(ndc, camera)
    const p = new THREE.Vector3()
    if (raycaster.ray.intersectPlane(d.plane, p)) d.by.copy(p).sub(d.point)
  } else {
    // Out along the surface normal: drag up to pull, down to push.
    d.by.copy(d.normal).multiplyScalar((d.startY - ev.clientY) * d.pxWorld)
  }
  const max = MAX_PULL * radius
  if (d.by.length() > max) d.by.setLength(max)
  const len = d.by.length()
  arrow.visible = len > 0.05
  if (arrow.visible) {
    arrow.position.copy(d.point)
    arrow.setDirection(d.by.clone().normalize())
    arrow.setLength(len, Math.min(1.2, len * 0.4), Math.min(0.8, len * 0.3))
  }
  showHud(`pull ${len.toFixed(1)} mm of ${max.toFixed(1)}`)
  if (len > 0.05) preview(state.history.steps.concat(pullSteps(d)))
})

async function endDrag(ev) {
  const d = dragging
  if (!d) return
  dragging = null
  queued = null
  controls.enabled = true
  arrow.visible = false
  if (d.by.length() > 0.05) await post('/api/steps', pullSteps(d))
  else await fetchMesh(await fetch('/api/mesh'))
}
el.addEventListener('pointerup', endDrag)
el.addEventListener('pointercancel', endDrag)

loadState()
</script>
</body>
</html>
